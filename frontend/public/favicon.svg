<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <!-- Black Background -->
  <rect
    width="64"
    height="64"
    rx="32"
    fill="#050505"
  />

  <!-- Gold Circle -->
  <circle
    cx="32"
    cy="32"
    r="28"
    fill="none"
    stroke="#D4AF37"
    stroke-width="2.5"
  />

  <!-- Large Centered R -->
  <text
    x="32"
    y="32"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="49"
    font-weight="bold"
    fill="#D4AF37">
    R
  </text>

</svg>